<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste API Local - LogiQuiz</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .questao { border: 1px solid #ccc; padding: 20px; margin: 10px 0; }
        button { padding: 10px; margin: 5px; }
        .json { background: #f5f5f5; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Teste da API LogiQuiz (Modo Local)</h1>
    
    <div>
        <button onclick="testarEndpoint('/questoes')">GET /api/questoes</button>
        <button onclick="testarEndpoint('/questoes/random')">GET /api/questoes/random</button>
        <button onclick="testarEndpoint('/questoes/dificuldade/FACIL')">GET Questões Fáceis</button>
        <button onclick="testarEndpoint('/questoes/1')">GET /api/questoes/1</button>
    </div>
    
    <div id="resultado"></div>

    <script>
        // DADOS MOCK - Simula sua API
        const questaoData = [
            {
                id: 1,
                enunciado: "Qual o resultado da expressão booleana: (True AND False) OR True?",
                alternativas: ["True", "False", "Indefinido", "Error"],
                respostaCorreta: "True",
                fonte: "LogiQuiz",
                dificuldade: "FÁCIL"
            },
            {
                id: 2,
                enunciado: "A negação de (A AND B) é equivalente a:",
                alternativas: ["NOT A AND NOT B", "NOT A OR NOT B", "A OR B", "A AND B"],
                respostaCorreta: "NOT A OR NOT B",
                fonte: "LogiQuiz - Lei de De Morgan",
                dificuldade: "MÉDIO"
            },
            {
                id: 3,
                enunciado: "Se A = True e B = False, qual o valor de NOT A OR B?",
                alternativas: ["True", "False", "Depende", "Nenhuma das anteriores"],
                respostaCorreta: "False",
                fonte: "LogiQuiz",
                dificuldade: "FÁCIL"
            },
            {
                id: 4,
                enunciado: "Qual expressão representa a porta lógica XOR?",
                alternativas: ["A AND B", "A OR B", "(A AND NOT B) OR (NOT A AND B)", "NOT A AND NOT B"],
                respostaCorreta: "(A AND NOT B) OR (NOT A AND B)",
                fonte: "LogiQuiz - Portas Lógicas",
                dificuldade: "MÉDIO"
            }
        ];

        // Simula os endpoints da API
        function mockAPI(endpoint) {
            console.log("📡 Mock API chamada:", endpoint);
            
            if (endpoint === '/questoes') {
                return {
                    status: 200,
                    data: questaoData
                };
            }
            else if (endpoint === '/questoes/random') {
                const randomIndex = Math.floor(Math.random() * questaoData.length);
                return {
                    status: 200,
                    data: questaoData[randomIndex]
                };
            }
            else if (endpoint.startsWith('/questoes/dificuldade/')) {
                const dificuldade = endpoint.split('/').pop().toUpperCase();
                const filtered = questaoData.filter(q => q.dificuldade === dificuldade);
                return {
                    status: 200,
                    data: filtered
                };
            }
            else if (endpoint.startsWith('/questoes/')) {
                const id = parseInt(endpoint.split('/').pop());
                const questao = questaoData.find(q => q.id === id);
                if (questao) {
                    return {
                        status: 200,
                        data: questao
                    };
                } else {
                    return {
                        status: 404,
                        data: { error: "Questão não encontrada" }
                    };
                }
            }
            else {
                return {
                    status: 404,
                    data: { error: "Endpoint não encontrado" }
                };
            }
        }

        // Função para testar os endpoints
        function testarEndpoint(endpoint) {
            const resultado = mockAPI(endpoint);
            const resultadoDiv = document.getElementById('resultado');
            
            resultadoDiv.innerHTML = `
                <div class="questao">
                    <h3>Endpoint: <code>${endpoint}</code></h3>
                    <div class="json">
                        <strong>Status:</strong> ${resultado.status}<br>
                        <strong>Resposta:</strong>
                        <pre>${JSON.stringify(resultado.data, null, 2)}</pre>
                    </div>
                </div>
            `;
        }

        // Testa automaticamente ao carregar
        testarEndpoint('/questoes');
    </script>
</body>
</html>
