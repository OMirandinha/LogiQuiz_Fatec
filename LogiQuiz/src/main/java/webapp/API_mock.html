<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiQuiz - Teste de Lógica Booleana</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>🧠 LogiQuiz</h1>
            <div class="subtitle">Teste seus conhecimentos em Lógica Booleana</div>
        </div>

        <!-- Barra de Progresso -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>
            <div class="progress-text">
                <span id="currentQuestion">Questão 1</span>
                <span id="totalQuestions">de 5</span>
            </div>
        </div>

        <!-- Container da Questão -->
        <div id="questionScreen">
            <div class="question-container">
                <div class="question-header">
                    <div class="question-number" id="questionNumber">Questão 1</div>
                    <div class="difficulty facil" id="questionDifficulty">FÁCIL</div>
                </div>

                <div class="question-text" id="questionText">
                    Carregando questão...
                </div>

                <div class="alternatives-container" id="alternativesContainer">
                    <!-- Alternativas serão inseridas aqui -->
                </div>

                <div class="feedback hidden" id="feedback"></div>

                <div class="actions">
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>
                        Próxima Questão →
                    </button>
                </div>
            </div>
        </div>

        <!-- Tela de Resultado -->
        <div id="resultScreen" class="hidden">
            <div class="result-container">
                <div class="result-icon">🎉</div>
                <div class="result-title">Quiz Concluído!</div>
                <div class="result-score" id="finalScore">0/5</div>
                <div class="result-text" id="resultMessage">Parabéns pelo esforço!</div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number" id="correctAnswers">0</div>
                        <div class="stat-label">Corretas</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="totalQuestionsResult">5</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="percentage">0%</div>
                        <div class="stat-label">Acertos</div>
                    </div>
                </div>

                <button class="btn btn-success" onclick="restartQuiz()" style="margin-top: 30px;">
                    🔄 Fazer Novamente
                </button>
            </div>
        </div>
    </div>

    <script src="Script.js"></script>
</body>
</html>
