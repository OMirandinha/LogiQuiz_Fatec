<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>LogiQuiz - Teste Sua Lógica Booleana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .controls {
            background: #f8f9fa;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #dee2e6;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #3498db;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #27ae60;
            color: white;
        }
        
        .btn-success:hover {
            background: #219a52;
            transform: translateY(-2px);
        }
        
        .btn-warning {
            background: #f39c12;
            color: white;
        }
        
        .btn-warning:hover {
            background: #d35400;
            transform: translateY(-2px);
        }
        
        .questao-container {
            padding: 30px;
        }
        
        .questao-card {
            background: #fff;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .enunciado {
            font-size: 1.3em;
            color: #2c3e50;
            margin-bottom: 25px;
            line-height: 1.6;
            font-weight: 500;
        }
        
        .alternativas {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .alternativa {
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .alternativa:hover {
            border-color: #3498db;
            background: #f8f9fa;
        }
        
        .alternativa input {
            margin-right: 10px;
        }
        
        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
            font-size: 0.9em;
            color: #6c757d;
        }
        
        .dificuldade {
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.8em;
        }
        
        .facil { background: #d4edda; color: #155724; }
        .medio { background: #fff3cd; color: #856404; }
        .dificil { background: #f8d7da; color: #721c24; }
        
        .lista-questoes {
            display: none;
            padding: 20px;
        }
        
        .questao-item {
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }
        
        .stats {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            font-size: 1.1em;
            color: #495057;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 LogiQuiz</h1>
            <div class="subtitle">Teste seus conhecimentos em Lógica Booleana</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="carregarQuestaoAleatoria()">
                🎲 Questão Aleatória
            </button>
            <button class="btn btn-success" onclick="carregarQuestaoFacil()">
                😊 Fácil
            </button>
            <button class="btn btn-warning" onclick="carregarQuestaoMedio()">
                😐 Médio
            </button>
            <button class="btn btn-primary" onclick="carregarQuestaoDificil()">
                😰 Difícil
            </button>
            <button class="btn btn-success" onclick="listarTodasQuestoes()">
                📚 Todas as Questões
            </button>
        </div>
        
        <div class="questao-container">
            <div id="questaoCard" class="questao-card">
                <div class="loading">
                    <p>Carregando questão...</p>
                </div>
            </div>
        </div>
        
        <div id="listaQuestoes" class="lista-questoes"></div>
        
        <div class="stats" id="stats">
            <!-- Estatísticas serão carregadas aqui -->
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/LogiQuiz/api/questoes';
        
        // Carregar estatísticas ao iniciar
        window.addEventListener('load', function() {
            carregarQuestaoAleatoria();
            carregarEstatisticas();
        });
        
        async function carregarEstatisticas() {
            try {
                const response = await fetch(API_BASE);
                const questões = await response.json();
                const total = questões.length;
                
                const statsDiv = document.getElementById('stats');
                statsDiv.innerHTML = `
                    <strong>📊 Estatísticas do LogiQuiz:</strong> 
                    ${total} questões disponíveis | 
                    ${questões.filter(q => q.dificuldade === 'FÁCIL').length} Fáceis |
                    ${questões.filter(q => q.dificuldade === 'MÉDIO').length} Médias |
                    ${questões.filter(q => q.dificuldade === 'DIFÍCIL').length} Difíceis
                `;
            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
            }
        }
        
        async function carregarQuestaoAleatoria() {
            await carregarQuestao(API_BASE + '/random');
        }
        
        async function carregarQuestaoFacil() {
            await carregarQuestaoPorDificuldade('FÁCIL');
        }
        
        async function carregarQuestaoMedio() {
            await carregarQuestaoPorDificuldade('MÉDIO');
        }
        
        async function carregarQuestaoDificil() {
            await carregarQuestaoPorDificuldade('DIFÍCIL');
        }
        
        async function carregarQuestaoPorDificuldade(dificuldade) {
            const response = await fetch(API_BASE + '/dificuldade/' + dificuldade);
            const questões = await response.json();
            if (questões.length > 0) {
                // Seleciona uma questão aleatória da lista
                const randomIndex = Math.floor(Math.random() * questões.length);
                exibirQuestao(questões[randomIndex]);
            } else {
                alert('Nenhuma questão encontrada para este nível de dificuldade.');
            }
        }
        
        async function carregarQuestao(url) {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const questao = await response.json();
                    exibirQuestao(questao);
                    document.getElementById('listaQuestoes').style.display = 'none';
                    document.querySelector('.questao-container').style.display = 'block';
                } else {
                    alert('Erro ao carregar questão. Tente novamente.');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro de conexão. Verifique se o servidor está rodando.');
            }
        }
        
        function exibirQuestao(questao) {
            const questaoCard = document.getElementById('questaoCard');
            
            questaoCard.innerHTML = `
                <div class="enunciado">${questao.enunciado}</div>
                <div class="alternativas" id="alternativas">
                    ${questao.alternativas.map((alt, index) => `
                        <div class="alternativa">
                            <input type="radio" name="alternativa" id="alt${index}" value="${index}">
                            <label for="alt${index}">
                                <strong>${String.fromCharCode(65 + index)})</strong> ${alt}
                            </label>
                        </div>
                    `).join('')}
                </div>
                <div class="meta-info">
                    <div class="fonte">
                        <strong>Fonte:</strong> ${questao.fonte}
                    </div>
                    <div class="dificuldade ${questao.dificuldade.toLowerCase()}">
                        ${questao.dificuldade}
                    </div>
                </div>
            `;
        }
        
        async function listarTodasQuestoes() {
            try {
                const response = await fetch(API_BASE);
                const questões = await response.json();
                
                const listaContainer = document.getElementById('listaQuestoes');
                listaContainer.innerHTML = '<h2 style="margin-bottom: 20px; text-align: center;">📚 Todas as Questões do LogiQuiz</h2>';
                
                questões.forEach((questao, index) => {
                    const questaoDiv = document.createElement('div');
                    questaoDiv.className = 'questao-item';
                    questaoDiv.innerHTML = `
                        <h3>Questão ${index + 1}</h3>
                        <div class="enunciado">${questao.enunciado}</div>
                        <div class="alternativas">
                            ${questao.alternativas.map((alt, i) => `
                                <div style="margin: 5px 0;">
                                    <strong>${String.fromCharCode(65 + i)})</strong> ${alt}
                                </div>
                            `).join('')}
                        </div>
                        <div class="meta-info">
                            <span><strong>Fonte:</strong> ${questao.fonte}</span>
                            <span class="dificuldade ${questao.dificuldade.toLowerCase()}">
                                ${questao.dificuldade}
                            </span>
                        </div>
                    `;
                    listaContainer.appendChild(questaoDiv);
                });
                
                listaContainer.style.display = 'block';
                document.querySelector('.questao-container').style.display = 'none';
                
            } catch (error) {
                console.error('Erro:', error);
            }
        }
    </script>
</body>
</html>
