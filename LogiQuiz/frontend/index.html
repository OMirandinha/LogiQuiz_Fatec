<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Lógica Booleana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quiz de Lógica Booleana</h1>
            <p>Teste seus conhecimentos em álgebra booleana</p>
        </header>

        <main>
            <!-- Tela de Configuração do Quiz -->
            <div id="config-container" class="config-container">
                <h2>Configuração do Quiz</h2>
                <div class="config-form">
                    <div class="form-group">
                        <label for="dificuldade">Nível de Dificuldade:</label>
                        <select id="dificuldade" class="form-control">
                            <option value="todas">Todas as Dificuldades</option>
                            <option value="facil">Fácil</option>
                            <option value="medio">Médio</option>
                            <option value="dificil">Difícil</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quantidade">Quantidade de Questões:</label>
                        <input type="number" id="quantidade" class="form-control" min="1" max="20" value="5">
                        <small>Máximo: 20 questões</small>
                    </div>
                    <button id="start-btn" class="btn btn-primary">Iniciar Quiz</button>
                </div>
            </div>

            <!-- Tela de Loading -->
            <div id="loading" class="loading hidden">Carregando questões...</div>
            
            <!-- Tela do Quiz -->
            <div id="quiz-container" class="quiz-container hidden">
                <div class="quiz-header">
                    <div class="quiz-info">
                        <span id="question-number">Questão 1 de 5</span>
                        <span id="dificuldade-indicator" class="dificuldade-indicator">Fácil</span>
                    </div>
                    <button id="skip-btn" class="btn-secondary">Pular Questão</button>
                </div>
                
                <div class="question-content">
                    <h2 id="question-text"></h2>
                    <div id="alternatives" class="alternatives"></div>
                </div>

                <div id="feedback" class="feedback hidden"></div>
                
                <div class="navigation">
                    <button id="prev-btn" class="btn">Anterior</button>
                    <button id="next-btn" class="btn">Próxima</button>
                </div>

                <!-- Barra de Progresso -->
                <div class="progress-container">
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="progress-text">0/0 questões respondidas</span>
                    </div>
                </div>
            </div>

            <!-- Tela de Resultados -->
            <div id="results-container" class="results-container hidden">
                <h2>Resultado do Quiz</h2>
                <div class="results-stats">
                    <div class="result-item">
                        <div class="result-label">Questões Respondidas</div>
                        <div class="result-value" id="total-answered">0</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Respostas Corretas</div>
                        <div class="result-value" id="total-correct">0</div>
                    </div>
                    <div class="result-item highlight">
                        <div class="result-label">Porcentagem de Acerto</div>
                        <div class="result-value" id="final-percentage">0%</div>
                    </div>
                </div>
                <div class="results-actions">
                    <button id="restart-btn" class="btn btn-primary">Fazer Novo Quiz</button>
                    <button id="review-btn" class="btn btn-secondary">Revisar Respostas</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
